/* Each glyph moves on the audio clock; pausing freezes the dance. */
.caption{width:49%;left:10%;top:45%}
.original-line{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-weight:600;font-size:clamp(30px,3.8vw,56px);letter-spacing:.035em;line-height:1.65;min-height:160px;perspective:700px}
.original-line.chorus{font-size:clamp(40px,4.7vw,72px);font-weight:700}
.original-line>.lyric-character{background:none;color:inherit;filter:none;vertical-align:baseline;animation:word-enter .48s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*.025s)}
.original-line .glyph{display:inline-block;opacity:1;animation:none;filter:none;transform:translateY(var(--lift,0px)) rotate(var(--turn,0deg)) scale(var(--zoom,1));background:linear-gradient(90deg,#ffa9b8 var(--sung,0%),#bdb4b880 var(--sung,0%));background-clip:text;-webkit-background-clip:text;color:transparent;will-change:transform}
.original-line .is-current .glyph{background:none;color:#ffe0ae;text-shadow:0 0 25px #ee7c8870}
.original-line .is-key .glyph{font-weight:800}
.paused .original-line>.lyric-character{animation:none;opacity:1;filter:none;transform:none}
.original-line[data-motion="swing"]>.lyric-character{--entry-x:-32px;--entry-y:20px;--entry-r:-24deg}
.original-line[data-motion="wave"]>.lyric-character{--entry-x:0px;--entry-y:50px;--entry-r:12deg}
.original-line[data-motion="bounce"]>.lyric-character{--entry-x:18px;--entry-y:-40px;--entry-r:-10deg}
.original-line[data-motion="rise"]>.lyric-character{--entry-x:0px;--entry-y:50px;--entry-r:0deg}
@keyframes word-enter{0%{opacity:0;transform:translate(var(--entry-x,0px),var(--entry-y,40px)) rotate(var(--entry-r,15deg)) scale(.5)}70%{opacity:1;transform:translate(0,-8px) rotate(-3deg) scale(1.08)}100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
.eyebrow{color:#d4a0a9}.scene-number{color:#bb8b99}.small-line{min-height:22px}.rose-tag{color:#cf8997}

<body>
<div class="theatre" id="theatre">
<div class="noise" aria-hidden="true"></div>
<header><div class="brand">SONG / 文字剧场</div><div class="top-actions"><button class="quiet-button" id="export">导出视频 ↓</button><button class="quiet-button" id="import">歌曲与背景</button><button class="quiet-button" id="fullscreen">全屏 ↗</button></div></header>
<main id="stage">
<canvas id="rose" role="img" aria-label="由玫瑰二字组成的花瓣在音乐中聚拢、舒展"></canvas>
<div class="scene-number" id="scene-number">序 · 00</div>
<div class="caption" id="caption">
<div class="eyebrow" id="eyebrow">歌曲 · 文字动画</div>
<div id="title-card"><h1 class="hero-title">歌曲</h1><div class="artist">演示<span class="divider"></span><span style="font:italic 13px Georgia,serif;letter-spacing:2px">Rose</span></div><div class="subtitle">音乐响起，文字跟着跳起来。<br>点击下方 ▶ 开始观看。</div></div>
<div id="verse-card" hidden><h2 class="original-line" id="line"></h2><div class="small-line" id="translation"></div></div>
</div>
<div class="stage-footer"><span class="mini-rose">✳</span><span id="stage-note">只播放配置指定的片段</span></div><div class="rose-tag">let the words bloom.</div>
</main>
<footer><div class="player">
<button class="play" id="play" aria-label="播放内置歌曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16l13-8z"/></svg></button>
<div class="track-meta"><div class="track-name" id="track-name">歌曲 · 文字动画</div><div class="track-note" id="track-note">音乐 · 当前片段</div></div>
<div class="scrub"><div class="times"><span id="elapsed">00:00</span><span id="total">00:00</span></div><input class="progress" id="seek" type="range" min="0" max="1" value="0" step="0.05" aria-label="播放进度"></div>
<button class="speaker" id="mute" aria-label="静音" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5zM15 8q5 4 0 8M18 5q8 7 0 14"/></svg><small id="volume-word">声音开</small></button>
</div><div class="credit-row"><span><span class="live-dot"></span><span id="mode-label">音乐 · 跳动歌词</span></span><span class="hint" id="hint">点击播放 · 空格暂停 · ← → 快进</span></div></footer>
</div>
<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="import-title">
<div class="panel"><button class="close" id="close" aria-label="关闭">×</button><h2 id="import-title">歌曲与背景</h2><p>歌曲和歌词已经内置，可以直接播放。如需微调，下面的秒数可以让歌词提前或延后。</p>
<label for="background-preset">动画背景</label><select id="background-preset"><option value="rose">文字玫瑰</option><option value="ocean">动态海浪</option><option value="stars">流动星空</option></select><label for="background-image">自定义背景图片（可选）</label><input id="background-image" type="file" accept="image/png,image/jpeg,image/webp">
<label for="audio-file">更换音频（可选，已内置当前音频）</label><input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac">
<label for="lrc-file">同步歌词 · LRC / TXT（可选）</label><input id="lrc-file" type="file" accept=".lrc,.txt">
<label for="lrc-text">也可以直接粘贴你有权使用的歌词</label><textarea id="lrc-text" placeholder="[00:05.00]第一行文字&#10;[00:12.00]第二行文字&#10;&#10;没有时间轴也可以，页面会按音频时长平均分配。"></textarea>
<div class="offset-row"><label for="offset">歌词提前（秒，负数表示延后）</label><input id="offset" type="number" min="-30" max="30" step="0.1" value="0"></div>
<div class="panel-actions"><button id="apply" class="primary">应用到文字剧场</button><button id="demo" class="secondary">恢复内置歌曲</button></div><div id="notice" class="notice" role="status">已内置当前项目的歌词。</div>
</div></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="export-progress" id="export-panel" role="status" hidden><button id="export-cancel">取消</button><strong id="export-status">正在生成视频</strong><progress id="export-meter" value="0" max="100"></progress><p id="export-help">从头播放并录制音乐、歌词与背景。需要等待片段完整播放，请保持页面打开。</p><a id="export-download" hidden download>保存视频</a></div>
<audio id="audio" src="__AUDIO_FILE__" preload="auto"></audio>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const audio=$('audio'), canvas=$('rose'), ctx=canvas.getContext('2d'), stage=$('stage');
const SONG_CONFIG=__CONFIG_JSON__;
const DEFAULT_AUDIO=SONG_CONFIG.audio;
const demoLines=SONG_CONFIG.lyrics;
const envelope=[];
let lines=demoLines.map(row=>({...row})), originalDemo=false, customLyrics=true, lineIndex=-1, duration=SONG_CONFIG.duration, blobUrl=null, demoUrl=null, offset=SONG_CONFIG.offset||0;
let audioCtx, analyser, frequencies, amplitude=0, lastDraw=0, lastTime=0, visualTime=0, width=1,height=1, pixels=1, dragCount=0, toastTimer;

audio.volume=.72;
let backgroundPreset=SONG_CONFIG.background.preset||'rose',backgroundImage=null;
const motionStrength=Math.max(0,Math.min(2,SONG_CONFIG.motion.strength??1));

function format(t){t=Math.max(0,Math.floor(t||0));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function setAudioContext(){
  // Let native audio play directly for file previews; their opaque origin can
  // cause a MediaElementAudioSource to output silence despite successful play.
  if(!/^https?:$/.test(window.location?.protocol||''))return Promise.resolve();
  if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;frequencies=new Uint8Array(analyser.frequencyBinCount);audioCtx.createMediaElementSource(audio).connect(analyser);analyser.connect(audioCtx.destination)}
  return audioCtx.resume();
}
async function play(){
  try{
    if(!audio.src)audio.src=DEFAULT_AUDIO;
    if(audio.paused){if(audio.ended)audio.currentTime=0;await setAudioContext();await audio.play()}else audio.pause();
  }catch(e){$('play').disabled=false;toast('播放失败，请重新点击播放或导入其他音频。');console.error(e)}
}
function syncButton(){const paused=audio.paused;$('play').innerHTML=paused?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16l13-8z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';$('play').setAttribute('aria-label',paused?'播放':'暂停');$('theatre').classList.toggle('paused',paused);$('hint').textContent=paused?'点击播放 · 空格暂停 · ← → 快进':'正在播放 · 空格暂停 · ← → 快进'}
function renderLine(t,force=false){
  const adjusted=t+offset;
  let index=-1;for(let i=0;i<lines.length;i++){if(lines[i].time<=adjusted)index=i;else break}
  const bridge=index>=0&&lines[index].end<adjusted&&lines[index+1]&&lines[index+1].time>adjusted;
  if(index===lineIndex&&Boolean(bridge)===bridgeActive&&!force)return;

  $('title-card').hidden=!title;$('verse-card').hidden=title;
  $('scene-number').textContent=title?'序 · 00':String(index+1).padStart(2,'0')+' / '+String(lines.length).padStart(2,'0');

  const row=lines[index];$('line').replaceChildren();lyricEls=[];$('line').setAttribute('data-motion',['wave','bounce','swing','rise'][index%4]);

$('seek').addEventListener('input',e=>{if(!audio.src){toast('先点击播放，或导入歌曲。');e.target.value=0;return}audio.currentTime=Number(e.target.value);e.target.style.setProperty('--pct',`${audio.currentTime/duration*100}%`);renderLine(audio.currentTime,true)});
$('mute').addEventListener('click',()=>{audio.muted=!audio.muted;$('mute').setAttribute('aria-pressed',String(audio.muted));$('mute').setAttribute('aria-label',audio.muted?'开启声音':'静音');$('volume-word').textContent=audio.muted?'声音关':'声音开';$('mute').style.opacity=audio.muted?'.3':'.65'});
$('import').addEventListener('click',openDrawer);$('close').addEventListener('click',closeDrawer);$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))closeDrawer()});
$('audio-file').addEventListener('change',e=>loadAudio(e.target.files[0]));$('lrc-file').addEventListener('change',async e=>{if(e.target.files[0]){$('lrc-text').value=await e.target.files[0].text();$('notice').textContent='歌词已读取，点击「应用到文字剧场」。'}});
$('apply').addEventListener('click',applyLyrics);$('demo').addEventListener('click',resetDemo);
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('theatre').requestFullscreen()}catch{toast('当前预览不支持全屏，可在浏览器打开此页面。')}});
document.addEventListener('fullscreenchange',()=>$('fullscreen').textContent=document.fullscreenElement?'退出全屏 ↙':'全屏 ↗');
document.addEventListener('keydown',e=>{
  if(exportJob)return;
  if(e.key==='Escape'&&!$('drawer').hidden){closeDrawer();return}
  if(e.target.matches('input,textarea,button')||!$('drawer').hidden)return;
  if(e.code==='Space'){e.preventDefault();play()}if(audio.src&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();audio.currentTime=Math.max(0,Math.min(duration,audio.currentTime+(e.key==='ArrowRight'?5:-5)))}
});
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();pointer.x=(e.clientX-r.left)/width-.5;pointer.y=(e.clientY-r.top)/height-.5});stage.addEventListener('pointerleave',()=>pointer={x:0,y:0});
// Keep the import dialog keyboard-contained.
$('drawer').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const items=[...$('drawer').querySelectorAll('button,input,textarea')],first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
document.addEventListener('dragenter',e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();dragCount++;document.body.classList.add('drag-over')}});document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('dragleave',()=>{dragCount--;if(dragCount<=0){dragCount=0;document.body.classList.remove('drag-over')}});
document.addEventListener('drop',async e=>{e.preventDefault();dragCount=0;document.body.classList.remove('drag-over');for(const file of e.dataTransfer.files){if(/\.(lrc|txt)$/i.test(file.name)){$('lrc-text').value=await file.text();applyLyrics()}else if(file.type.startsWith('audio/')||/\.(mp3|wav|m4a|ogg|flac)$/i.test(file.name)){await loadAudio(file);toast('音频已导入，点击播放。')}else toast('请导入音频或 LRC 歌词文件。')}});
window.addEventListener('pagehide',()=>{audio.pause();if(blobUrl)URL.revokeObjectURL(blobUrl);if(demoUrl)URL.revokeObjectURL(demoUrl)});
function setBackground(preset){backgroundPreset=preset;$('background-preset').value=preset;const colors={rose:['#100f11','#ec5365'],ocean:['#071b2b','#72d1e6'],stars:['#121326','#a4a9ff']}[preset];document.documentElement.style.setProperty('--bg',SONG_CONFIG.background.color||colors[0]);document.documentElement.style.setProperty('--red',SONG_CONFIG.background.accent||colors[1]);$('theatre').style.background='var(--bg)';}
function loadBackground(url){const img=new Image();img.onload=()=>{backgroundImage=img;};img.onerror=()=>toast('背景图片无法读取。');img.src=url;}
$('background-preset').addEventListener('change',e=>{backgroundImage=null;setBackground(e.target.value);});
$('background-image').addEventListener('change',e=>{if(e.target.files[0])loadBackground(URL.createObjectURL(e.target.files[0]));});
$('theatre').classList.toggle('still-words',motionStrength===0);setBackground(backgroundPreset);if(SONG_CONFIG.background.image)loadBackground(SONG_CONFIG.background.image);
document.title=SONG_CONFIG.title+' · '+SONG_CONFIG.artist+'｜歌曲动画';
$('title-card').querySelector('h1').textContent=SONG_CONFIG.title;
$('title-card').querySelector('.artist').textContent=SONG_CONFIG.artist;
$('track-name').textContent=SONG_CONFIG.title+' · '+SONG_CONFIG.artist;
$('total').textContent=format(duration);$('seek').max=duration;
$('mode-label').textContent=SONG_CONFIG.timing==='estimated'?'歌词时间为估算 · 可导入 LRC 校准':SONG_CONFIG.timing==='sentence'?'按句同步 · 字级动效为推估':'逐字同步 · 跳动歌词';
$('notice').textContent=SONG_CONFIG.estimated?'当前使用估算时间，需要 LRC 或逐字时间轴才能校准演唱。':'已载入当前项目的时间轴。';
$('offset').value=String(offset);
buildFlower();new ResizeObserver(resize).observe(stage);resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
